# Actualizaciones de dependencias (hardening de la Capa 7): PRs semanales agrupados. El CI
# valida cada una (tests, licencias, vulnerabilidades) antes de mergear.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      python-menores:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      js-menores:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /desktop/src-tauri
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      rust-menores:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
