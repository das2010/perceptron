name: Desktop

# App Tauri 2 + runtime embebido (ADR-0026). Corre en PRs que tocan el desktop, en tags y a
# mano: compila en Windows y Ubuntu, genera los instaladores y los prueba desde cero
# (instalación silenciosa → aprovisionamiento → Engine → /system/health).
on:
  pull_request:
    paths:
      - "desktop/**"
      - "ui/src/lib/platform/**"
      - "ui/src/features/desktop/**"
      - ".github/workflows/desktop.yml"
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop/src-tauri -> target"
      - name: Dependencias de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libdbus-1-dev libssl-dev xvfb
      - run: pnpm install --frozen-lockfile
      - name: Recursos del instalador (uv, wheel, lock, torch)
        run: pnpm -C desktop prepare:runtime
      - name: Tests de Rust
        working-directory: desktop/src-tauri
        run: |
          pnpm -C ../../ui build
          cargo test --locked
      - name: Build de instaladores
        run: pnpm -C desktop tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Smoke test (Windows, NSIS silencioso)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait
          $dir = Join-Path $env:LOCALAPPDATA "Perceptron"
          $exe = Get-ChildItem $dir -Filter *.exe | Where-Object { $_.Name -notmatch "uninstall" } | Select-Object -First 1
          Write-Host "instalado: $($exe.FullName)"
          $report = Join-Path $env:RUNNER_TEMP "provision.json"
          $p = Start-Process -FilePath $exe.FullName -ArgumentList "--provision-only","--report",$report -Wait -PassThru
          Get-Content $report
          if ($p.ExitCode -ne 0) { throw "aprovisionamiento falló ($($p.ExitCode))" }
          $r = Get-Content $report | ConvertFrom-Json
          if (-not $r.ok) { throw "reporte con error" }
          if ($r.runtime.torch_variant -ne "cpu") { throw "variante inesperada: $($r.runtime.torch_variant)" }

      - name: Smoke test (Ubuntu, .deb)
        if: runner.os == 'Linux'
        run: |
          deb=$(ls desktop/src-tauri/target/release/bundle/deb/*.deb | head -1)
          sudo apt-get install -y "./$deb"
          bin=$(dpkg -L "$(dpkg-deb -f "$deb" Package)" | grep '^/usr/bin/' | head -1)
          echo "instalado: $bin"
          report="$RUNNER_TEMP/provision.json"
          xvfb-run -a "$bin" --provision-only --report "$report"
          cat "$report"
          python3 -c "import json,sys; r=json.load(open(sys.argv[1])); assert r['ok'], r; assert r['runtime']['torch_variant']=='cpu', r" "$report"

      - name: Logs del runtime
        if: failure()
        shell: bash
        run: |
          for d in "$LOCALAPPDATA/com.preteco.perceptron/runtime/logs" "$HOME/.local/share/com.preteco.perceptron/runtime/logs"; do
            [ -d "$d" ] && tail -n 200 "$d"/* || true
          done
