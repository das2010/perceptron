name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: engine (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --all-packages --locked
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Pytest
        run: uv run pytest --cov --cov-report=term --cov-report=xml
      # Mypy corre aunque fallen los tests: así un solo run informa ambos.
      - name: Mypy
        if: success() || failure()
        run: uv run mypy
      - name: Coverage >= 80% en core/domain (SPEC §13.6)
        run: uv run coverage report --include="*/perceptron/core/*,*/perceptron/domain/*" --fail-under=80
      - name: CLI smoke
        run: uv run perceptron --version

  ui:
    name: ui (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C ui lint
      - run: pnpm -C ui format:check
      - run: pnpm -C ui typecheck
      - run: pnpm -C ui test
      - run: pnpm -C ui build

  e2e:
    name: e2e ${{ matrix.uc }}
    # Solo Linux: Windows cuenta doble en minutos de Actions de repos privados.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: engine
    strategy:
      fail-fast: false
      matrix:
        uc: [uc01, uc03, uc04, uc07, uc08, uc09]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages --locked
      - name: Quickstart ${{ matrix.uc }} (10 trials, CPU, sin descargar pesos)
        run: uv run pytest -m e2e -s -v engine/tests/e2e -k ${{ matrix.uc }}

  contract:
    name: OpenAPI ↔ TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: uv sync --all-packages --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen:api
      - name: Tipos generados al día
        run: git diff --exit-code -- docs/api/openapi.json ui/src/lib/api/schema.d.ts
      - name: Publicar contrato regenerado (para commitearlo)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-contract
          path: |
            docs/api/openapi.json
            ui/src/lib/api/schema.d.ts

  fixtures:
    name: fixtures deterministas
    # Generados en Windows; libm puede diferir en el último bit entre SO.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fixtures/generate.py --check
