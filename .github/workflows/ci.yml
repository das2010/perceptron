name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Token mínimo: ningún job escribe en el repositorio (ASVS V14.1, hardening de la Capa 7).
permissions:
  contents: read

jobs:
  engine:
    name: engine (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows: la suite completa ya tarda ~28 min más mypy.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --all-packages --locked
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Pytest
        run: uv run pytest --cov --cov-report=term --cov-report=xml
      # Mypy corre aunque fallen los tests: así un solo run informa ambos.
      - name: Mypy
        if: success() || failure()
        run: uv run mypy
      - name: Coverage >= 80% en core/domain (SPEC §13.6)
        run: uv run coverage report --include="*/perceptron/core/*,*/perceptron/domain/*" --fail-under=80
      - name: CLI smoke
        run: uv run perceptron --version

  server-postgres:
    name: server (PostgreSQL 16)
    # Team Server (Capa 5): los tests del servidor sobre PostgreSQL real + migraciones, y la
    # cola con un worker Celery real sobre Valkey (Capa 5b).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      valkey:
        image: valkey/valkey:8
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: perceptron
          POSTGRES_PASSWORD: perceptron
          POSTGRES_DB: perceptron
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U perceptron"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages --locked
      - name: Pytest (server/tests contra PostgreSQL y Valkey)
        run: uv run pytest server/tests -v -s
        env:
          PERCEPTRON_TEST_DATABASE_URL: postgresql+pg8000://perceptron:perceptron@localhost:5432/perceptron
          PERCEPTRON_TEST_REDIS_URL: redis://localhost:6379/0
      - name: CLI (migrate + create-user)
        run: |
          uv run perceptron-server migrate
          PERCEPTRON_NEW_PASSWORD=clave-larga-de-ci uv run perceptron-server create-user ci@preteco.test --admin
        env:
          PERCEPTRON_DATABASE_URL: postgresql+pg8000://perceptron:perceptron@localhost:5432/perceptron
          PERCEPTRON_SERVER__SECRET_KEY: ci-secret-key-de-al-menos-32-caracteres
          PERCEPTRON_WORKSPACE_DIR: ${{ runner.temp }}/ws

  ui:
    name: ui (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C ui lint
      - run: pnpm -C ui format:check
      - run: pnpm -C ui typecheck
      - run: pnpm -C ui test
      - run: pnpm -C ui build

  e2e:
    name: e2e ${{ matrix.uc }}
    # Solo Linux: Windows cuenta doble en minutos de Actions de repos privados.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: engine
    strategy:
      fail-fast: false
      matrix:
        uc: [uc01, uc03, uc04, uc05, uc06, uc07, uc08, uc09]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages --locked
      - name: Quickstart ${{ matrix.uc }} (10 trials, CPU, sin descargar pesos)
        run: uv run pytest -m e2e -s -v engine/tests/e2e -k ${{ matrix.uc }}

  e2e-ui:
    name: e2e ui (UC-01 y UC-04 guiados)
    # Playwright contra el Engine real (perceptron serve) + Vite; LLM apagado (reglas).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install engine
        run: uv sync --all-packages --locked
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright browsers
        run: pnpm -C ui exec playwright install --with-deps chromium
      - name: E2E
        run: pnpm -C ui e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            ui/playwright-report
            ui/test-results
          if-no-files-found: ignore

  compose:
    name: compose (Team Server en Docker)
    # Imagen del servidor (Engine + UI web) con PostgreSQL, Valkey, MLflow server y un worker
    # por Docker Compose: arranca, migra, crea el Admin, responde login, RBAC, CSRF y fuentes
    # del servidor, y entrena un estudio en el worker (Capa 5b).
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: .env de prueba y fuente del servidor
        run: |
          cat > server/deploy/.env <<EOF
          POSTGRES_PASSWORD=$(openssl rand -hex 16)
          PERCEPTRON_SECRET_KEY=$(openssl rand -hex 32)
          PERCEPTRON_MASTER_KEY=$(openssl rand -base64 32)
          PERCEPTRON_ADMIN_EMAIL=admin@preteco.test
          PERCEPTRON_ADMIN_PASSWORD=clave-admin-de-compose
          PERCEPTRON_COOKIE_SECURE=false
          EOF
          mkdir -p server/deploy/sources
          cp fixtures/uc07_demand/demanda.csv server/deploy/sources/
      - name: docker compose up
        run: docker compose -f server/deploy/compose.yaml up -d --build --wait --wait-timeout 300
      - name: Smoke (health, UI, login, CSRF, RBAC, fuentes)
        run: sh server/deploy/smoke.sh http://localhost:8080
        env:
          PERCEPTRON_ADMIN_EMAIL: admin@preteco.test
          PERCEPTRON_ADMIN_PASSWORD: clave-admin-de-compose
      - name: Smoke de la cola (estudio en el worker, tracking en MLflow server)
        run: python3 server/deploy/smoke_study.py http://localhost:8080
        env:
          PERCEPTRON_ADMIN_EMAIL: admin@preteco.test
          PERCEPTRON_ADMIN_PASSWORD: clave-admin-de-compose
      - name: Backup, borrado total y restauración (RF-SRV-08)
        run: |
          sh server/deploy/backup.sh "$RUNNER_TEMP/backups"
          bk=$(ls -d "$RUNNER_TEMP"/backups/perceptron-*)
          ls -la "$bk"
          docker compose -f server/deploy/compose.yaml down -v
          docker compose -f server/deploy/compose.yaml up -d --wait --wait-timeout 300
          sh server/deploy/restore.sh "$bk"
          python3 server/deploy/smoke_study.py http://localhost:8080 --expect-project "Smoke cola"
        env:
          PERCEPTRON_ADMIN_EMAIL: admin@preteco.test
          PERCEPTRON_ADMIN_PASSWORD: clave-admin-de-compose
      - name: Logs
        if: failure()
        run: docker compose -f server/deploy/compose.yaml logs --no-color | tail -200

  e2e-web:
    name: e2e web (Team Server, UC-07 desde el navegador)
    # Aceptación de la Capa 5: login, roles Editor/Viewer y UC-07 completo en la UI web
    # servida por perceptron-server sobre PostgreSQL.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: perceptron
          POSTGRES_PASSWORD: perceptron
          POSTGRES_DB: perceptron
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U perceptron"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages --locked
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C ui build
      - name: Playwright browsers
        run: pnpm -C ui exec playwright install --with-deps chromium
      - name: E2E web
        run: pnpm -C ui e2e:server
        env:
          CI: "true"
          PERCEPTRON_DATABASE_URL: postgresql+pg8000://perceptron:perceptron@localhost:5432/perceptron
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-server
          path: |
            ui/playwright-report
            ui/test-results
          if-no-files-found: ignore

  helm:
    name: helm (chart del Team Server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint, render y validación de esquemas (kubeconform)
        run: |
          chart=server/deploy/helm/perceptron
          helm lint "$chart" -f server/deploy/helm/ci-values.yaml --strict
          helm template ci "$chart" -f server/deploy/helm/ci-values.yaml > rendered.yaml
          helm template min "$chart" --set secrets.databaseUrl=x,secrets.secretKey=x,secrets.masterKey=x > minimal.yaml
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          ./kubeconform -strict -summary rendered.yaml minimal.yaml
          grep -q "nvidia.com/gpu" rendered.yaml

  licenses:
    name: licencias (runtime distribuido)
    # Aceptación de la Capa 7: sin dependencias incompatibles con la distribución comercial.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages --locked
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Auditoría (Python, JS, Rust y pesos preentrenados)
        run: uv run python scripts/license_audit.py --out build/licenses
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: informe-de-licencias
          path: build/licenses

  security:
    name: seguridad (vulnerabilidades conocidas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: pip-audit del runtime Python
        run: |
          # Versiones fijadas del lock, sin instalar (torch +cpu no está en PyPI: se audita la base).
          uv export --no-dev --all-packages --no-hashes --no-emit-workspace --format requirements-txt \
            | sed -E 's/\+(cpu|cu[0-9]+)//' > req.txt
          uvx pip-audit==2.9.0 -r req.txt --no-deps --disable-pip --progress-spinner off
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (producción, altas y críticas)
        run: pnpm audit --prod --audit-level high
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit del desktop (RustSec)
        run: cargo audit --file desktop/src-tauri/Cargo.lock

  docs:
    name: documentación de usuario (MkDocs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Compilar el sitio (es/en)
        run: uvx --with mkdocs-material==9.6.* mkdocs build --strict --site-dir build/site
      - uses: actions/upload-artifact@v4
        with:
          name: guia-de-usuario
          path: build/site

  upgrade:
    name: actualización N → N+1 (sin pérdida de proyectos)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Workspace creado con la versión anterior (main)
        env:
          PERCEPTRON_OFFLINE: "1"
        run: |
          git worktree add "$RUNNER_TEMP/prev" origin/main
          cd "$RUNNER_TEMP/prev"
          uv sync --all-packages --locked
          uv run perceptron quickstart "$GITHUB_WORKSPACE/fixtures/uc01_churn/churn.csv" \
            --target churn --trials 1 --max-epochs 2 -w "$RUNNER_TEMP/ws" --json > /dev/null
      - run: uv sync --all-packages --locked
      - name: Abrirlo con la versión nueva
        run: uv run python scripts/upgrade_check.py "$RUNNER_TEMP/ws"

  contract:
    name: OpenAPI ↔ TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: uv sync --all-packages --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen:api
      - name: Tipos generados al día
        run: git diff --exit-code -- docs/api/openapi.json ui/src/lib/api/schema.d.ts
      - name: Publicar contrato regenerado (para commitearlo)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-contract
          path: |
            docs/api/openapi.json
            ui/src/lib/api/schema.d.ts

  fixtures:
    name: fixtures deterministas
    # Generados en Windows; libm puede diferir en el último bit entre SO.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fixtures/generate.py --check
      # Si cambió un generador: se publican los fixtures regenerados en Windows para commitearlos.
      - name: Regenerar fixtures
        if: failure()
        run: python fixtures/generate.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fixtures-regenerados
          path: fixtures

  export-o5:
    name: export O5 (proyecto y servidor en contenedores limpios)
    # Aceptación de la Capa 4 (SPEC §14): el proyecto exportado entrena e infiere en una
    # máquina limpia con uv sync, y el servidor de inferencia responde desde su Docker.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages --locked
      - name: Entrenar UC-01 y exportar (ONNX, servidor y proyecto)
        env:
          PERCEPTRON_OFFLINE: "1"
        run: |
          ws="$RUNNER_TEMP/ws"
          uv run perceptron quickstart fixtures/uc01_churn/churn.csv --target churn \
            --trials 1 --max-epochs 3 -w "$ws" --json > "$RUNNER_TEMP/qs.json"
          run_id=$(python3 -c "import json,sys; t=open(sys.argv[1]).read(); print(json.JSONDecoder().raw_decode(t[t.find('{'):])[0]['best_run_id'])" "$RUNNER_TEMP/qs.json")
          mkdir -p out
          uv run perceptron export "$run_id" -w "$ws" --formats onnx \
            --serving out/serving.zip --project out/project.zip
          (cd out && unzip -q serving.zip -d serving && unzip -q project.zip -d project)
          python3 - <<'PY'
          import csv, json
          rows = list(csv.DictReader(open("fixtures/uc01_churn/churn.csv", encoding="utf-8")))[:3]
          for r in rows:
              r.pop("churn")
          json.dump({"rows": rows}, open("out/rows.json", "w"))
          PY
      - name: Proyecto exportado en un contenedor limpio (uv sync → train → infer → pytest)
        run: |
          proj=$(ls -d out/project/*/ | head -1)
          pkg=$(basename "$(ls -d "$proj"src/*/ | head -1)")
          docker run --rm -v "$PWD/$proj:/p" -w /p ghcr.io/astral-sh/uv:python3.12-bookworm-slim \
            sh -c "uv sync && uv run $pkg-train && uv run $pkg-infer data/val.parquet --out /p/pred.csv && uv run pytest -q"
          test -s "$proj/pred.csv" && head -3 "$proj/pred.csv"
      - name: Servidor de inferencia desde su Dockerfile
        run: |
          docker build -f out/serving/Dockerfile.cpu -t perceptron-serving out/serving
          docker run -d --name srv -p 8000:8000 -e PERCEPTRON_API_KEY=clave perceptron-serving
          for i in $(seq 1 60); do curl -fs localhost:8000/health && break; sleep 2; done
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/predict -H 'Content-Type: application/json' -d @out/rows.json)" = "401"
          curl -fs -X POST localhost:8000/predict -H "X-API-Key: clave" \
            -H "Content-Type: application/json" -d @out/rows.json | tee out/pred.json
          python3 -c "import json; p=json.load(open('out/pred.json'))['predictions']; assert len(p)==3 and 'confidence' in p[0], p"
      - name: Logs del servidor
        if: failure()
        run: docker logs srv || true
