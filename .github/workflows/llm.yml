name: LLM (aceptación real)

# Aceptación de la Capa 2 con proveedores reales (SPEC §14, §15.3, §15.4). No corre en
# cada PR: los PR usan FakeLLMProvider. Manual (workflow_dispatch) y nocturno.
# Claude necesita el secret ANTHROPIC_API_KEY y OpenAI, OPENAI_API_KEY; sin la clave, esos
# jobs se saltean con aviso. Ollama (local) no necesita clave.

on:
  workflow_dispatch:
    inputs:
      providers:
        description: "Proveedores"
        type: choice
        options: [all, claude, openai, ollama]
        default: all
      benchmark:
        description: "Correr también el benchmark O2"
        type: boolean
        default: false
      benchmark_provider:
        description: "Proveedor del benchmark"
        type: choice
        options: [openai, claude]
        default: openai
  schedule:
    - cron: "0 5 * * *"

concurrency:
  group: llm-${{ github.ref }}
  cancel-in-progress: false

env:
  PERCEPTRON_LLM__PROJECT_BUDGET_USD: "4"
  OLLAMA_MODEL: "qwen3:4b"

jobs:
  acceptance:
    name: agente ${{ matrix.provider }} ${{ matrix.uc }}
    strategy:
      fail-fast: false
      matrix:
        provider: [claude, openai, ollama]
        uc: [uc01, uc04, uc09]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PERCEPTRON_LLM__PROFILE: ${{ matrix.provider == 'claude' && 'anthropic' || matrix.provider }}
      PERCEPTRON_AGENT_MAX_COST: ${{ matrix.provider == 'ollama' && '1' || '1.5' }}
      PERCEPTRON_AGENT_MAX_STEPS: ${{ matrix.provider == 'ollama' && '6' || '10' }}
      PERCEPTRON_AGENT_MAX_TIME: ${{ matrix.provider == 'ollama' && '7200' || '2400' }}
      PERCEPTRON_REPORT_DIR: ${{ github.workspace }}/llm-reports
    steps:
      - uses: actions/checkout@v4
      - name: ¿Hay clave?
        id: key
        run: |
          wanted="${{ inputs.providers || 'all' }}"
          if [ "$wanted" != "all" ] && [ "$wanted" != "${{ matrix.provider }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif { [ "${{ matrix.provider }}" = "claude" ] && [ -z "$ANTHROPIC_API_KEY" ]; } ||
               { [ "${{ matrix.provider }}" = "openai" ] && [ -z "$OPENAI_API_KEY" ]; }; then
            echo "::notice::Sin clave de ${{ matrix.provider }}: se saltea ${{ matrix.uc }}"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@v6
        if: steps.key.outputs.skip != 'true'
        with:
          enable-cache: true
      - name: Install
        if: steps.key.outputs.skip != 'true'
        run: uv sync --all-packages --locked
      - name: Ollama
        if: steps.key.outputs.skip != 'true' && matrix.provider == 'ollama'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          # El instalador no siempre deja el servicio corriendo en el runner.
          if ! curl -sf http://127.0.0.1:11434/api/tags > /dev/null; then
            nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          fi
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:11434/api/tags > /dev/null && break; sleep 2; done
          curl -sf http://127.0.0.1:11434/api/tags > /dev/null || { cat "$RUNNER_TEMP/ollama.log"; exit 1; }
          ollama pull "$OLLAMA_MODEL"
      - name: Conexión con el LLM
        if: steps.key.outputs.skip != 'true'
        run: uv run perceptron llm test
      - name: Agente ${{ matrix.uc }}
        if: steps.key.outputs.skip != 'true'
        run: uv run pytest -m llm_live -s -v engine/tests/live -k ${{ matrix.uc }}
      - uses: actions/upload-artifact@v4
        if: always() && steps.key.outputs.skip != 'true'
        with:
          name: agente-${{ matrix.provider }}-${{ matrix.uc }}
          path: llm-reports
          if-no-files-found: ignore

  golden:
    name: golden ${{ matrix.provider }}
    strategy:
      fail-fast: false
      matrix:
        provider: [claude, openai, ollama]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PERCEPTRON_LLM__PROFILE: ${{ matrix.provider == 'claude' && 'anthropic' || matrix.provider }}
    steps:
      - uses: actions/checkout@v4
      - name: ¿Hay clave?
        id: key
        run: |
          wanted="${{ inputs.providers || 'all' }}"
          if [ "$wanted" != "all" ] && [ "$wanted" != "${{ matrix.provider }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif { [ "${{ matrix.provider }}" = "claude" ] && [ -z "$ANTHROPIC_API_KEY" ]; } ||
               { [ "${{ matrix.provider }}" = "openai" ] && [ -z "$OPENAI_API_KEY" ]; }; then
            echo "::notice::Sin clave de ${{ matrix.provider }}: se saltean sus golden"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@v6
        if: steps.key.outputs.skip != 'true'
        with:
          enable-cache: true
      - name: Install
        if: steps.key.outputs.skip != 'true'
        run: uv sync --all-packages --locked
      - name: Ollama
        if: steps.key.outputs.skip != 'true' && matrix.provider == 'ollama'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          # El instalador no siempre deja el servicio corriendo en el runner.
          if ! curl -sf http://127.0.0.1:11434/api/tags > /dev/null; then
            nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          fi
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:11434/api/tags > /dev/null && break; sleep 2; done
          curl -sf http://127.0.0.1:11434/api/tags > /dev/null || { cat "$RUNNER_TEMP/ollama.log"; exit 1; }
          ollama pull "$OLLAMA_MODEL"
      - name: Conexión con el LLM
        if: steps.key.outputs.skip != 'true'
        run: uv run perceptron llm test
      - name: Golden tests
        if: steps.key.outputs.skip != 'true'
        run: uv run pytest -m golden -v engine/tests/golden

  benchmark:
    name: benchmark O2
    if: github.event_name == 'workflow_dispatch' && inputs.benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PERCEPTRON_LLM__PROFILE: ${{ inputs.benchmark_provider == 'claude' && 'anthropic' || 'openai' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --all-packages --locked
      - name: Conexión con el LLM
        run: uv run perceptron llm test
      - name: Benchmark
        run: uv run perceptron bench run --out bench-report --max-cost 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-o2
          path: bench-report
          if-no-files-found: ignore
