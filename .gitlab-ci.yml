# Pipeline de GitLab: solo escaneos de seguridad (SAST y Secret Detection).
# El CI de build y tests del proyecto corre en GitHub Actions (.github/workflows).
# SAST customization: https://docs.gitlab.com/user/application_security/sast/#available-cicd-variables
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure/
stages:
- test
- secret-detection
include:
- template: Jobs/SAST.gitlab-ci.yml
- template: Jobs/Secret-Detection.gitlab-ci.yml
sast:
  stage: test
secret_detection:
  stage: secret-detection
