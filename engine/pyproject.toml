[project]
name = "perceptron-engine"
version = "0.1.0"
description = "Perceptron Engine: datos, profiling, entrenamiento, evaluación y export (desktop y servidor)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "Preteco" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "typer>=0.12",
  "sqlalchemy>=2.0",
  "platformdirs>=4.2",
  "python-ulid>=3.0",
  "pyyaml>=6.0",
]

[project.scripts]
perceptron = "perceptron.cli.main:app"

[project.optional-dependencies]
# Se completan en Capa 1+ (no adelantar capas: SPEC §14)
ml = []
llm = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["perceptron"]
