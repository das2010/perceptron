[project]
name = "perceptron-engine"
version = "0.1.0"
description = "Perceptron Engine: datos, profiling, entrenamiento, evaluación y export (desktop y servidor)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "Preteco" }]
dependencies = [
  "cryptography>=43",  # Apache-2.0/BSD: licencia firmada Ed25519 (Capa 7) y secretos
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "typer>=0.12",
  "sqlalchemy>=2.0",
  "platformdirs>=4.2",
  "python-ulid>=3.0",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
]

[project.scripts]
perceptron = "perceptron.cli.main:app"

[project.optional-dependencies]
# Stack de ML (Capa 1, ADR-0014). La variante de torch (CPU/CUDA/ROCm/XPU) se elige por hardware.
ml = [
  "torch>=2.6",  # weights_only=True por defecto en torch.load (checkpoints de Lightning)
  "torchvision>=0.21",
  "lightning>=2.4",
  "torchmetrics>=1.4",
  "timm>=1.0",
  "optuna>=4.0",
  "cmaes>=0.11",
  "mlflow>=2.16",
  "polars>=1.8",
  "pyarrow>=17",
  "fastexcel>=0.12",
  "scikit-learn>=1.5",
  "pillow>=10.4",
  "psutil>=6.0",
  "jinja2>=3.1",
  "transformers>=4.45",
  "tokenizers>=0.20",
  "soundfile>=0.12",
  "pycocotools>=2.0.8",
  "lightgbm>=4.5",
  "scipy>=1.11",  # BSD-3 (drift: KS, χ², Capa 6; ya llegaba por scikit-learn)
]
# Capa 2 (ADR-0020): SDKs de Anthropic y OpenAI (también Kimi y compatibles), keychain y
# cifrado de claves. Gemini y Ollama van por HTTP (httpx, en la base).
llm = [
  "anthropic>=0.40",
  "openai>=1.50",
  "keyring>=25",
]
# Capa 4a (ADR-0027): export a ONNX (con verificación en ONNX Runtime), fp16 e INT8. Licencias
# MIT. Separado de `ml` para que el paquete de inferencia pueda instalar solo el runtime.
export = [
  "onnx>=1.17",
  "onnxscript>=0.2",
  "onnxruntime>=1.20",
  "onnxconverter-common>=1.14",
  "prometheus-client>=0.20",
]
# Capa 4b (ADR-0028): explicabilidad con Captum (BSD; Shapley/KernelSHAP, Integrated Gradients,
# Grad-CAM) e informe PDF con reportlab (BSD, sin dependencias del sistema).
eval = [
  "captum>=0.7",
  "reportlab>=4.2",
  "markdown-it-py>=3",
]
# Capa 4c (RF-ING-03): drivers SQL puros o de licencia permisiva. PostgreSQL con pg8000 (BSD),
# MySQL/MariaDB con PyMySQL (MIT), SQL Server con pyodbc (MIT; requiere el ODBC Driver 18).
sources = [
  "pg8000>=1.31",
  "pymysql>=1.1",
  "pyodbc>=5.1",
]
# NER para PII en texto libre (L2, ADR-0022): `presidio-analyzer` y `presidio-anonymizer` se
# instalan aparte junto con un modelo NER de licencia compatible. No es un extra: spaCy
# restringe numpy y el lock resuelve todos los extras juntos.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["perceptron"]
