[project]
name = "perceptron-engine"
version = "0.1.0"
description = "Perceptron Engine: datos, profiling, entrenamiento, evaluación y export (desktop y servidor)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "Preteco" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "typer>=0.12",
  "sqlalchemy>=2.0",
  "platformdirs>=4.2",
  "python-ulid>=3.0",
  "pyyaml>=6.0",
]

[project.scripts]
perceptron = "perceptron.cli.main:app"

[project.optional-dependencies]
# Stack de ML (Capa 1, ADR-0014). La variante de torch (CPU/CUDA/ROCm/XPU) se elige por hardware.
ml = [
  "torch>=2.5",
  "torchvision>=0.20",
  "lightning>=2.4",
  "torchmetrics>=1.4",
  "timm>=1.0",
  "optuna>=4.0",
  "cmaes>=0.11",
  "mlflow>=2.16",
  "polars>=1.8",
  "pyarrow>=17",
  "fastexcel>=0.12",
  "scikit-learn>=1.5",
  "pillow>=10.4",
  "psutil>=6.0",
  "jinja2>=3.1",
]
# Capa 2
llm = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["perceptron"]
