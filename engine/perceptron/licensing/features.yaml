  eval.fairness:         { tier: premium, description: "Métricas de fairness" }
  export.rest_api:       { tier: core,    description: "API REST de inferencia" }
  export.code_project:   { tier: premium, description: "Proyecto de código exportable" }
  monitoring.drift:      { tier: premium, description: "Monitoreo de drift" }
