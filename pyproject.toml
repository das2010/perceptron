[project]
name = "perceptron-workspace"
version = "0.1.0"
description = "Perceptron monorepo (workspace root, no se publica)"
requires-python = ">=3.12,<3.14"
dependencies = []

[dependency-groups]
dev = [
  "perceptron-engine[ml]",
  "perceptron-server",
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-pyyaml",
  "types-psutil",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["engine", "server"]

[tool.uv.sources]
perceptron-engine = { workspace = true }
perceptron-server = { workspace = true }
# Desarrollo y CI con wheels CPU de PyTorch (ADR-0014). La app instala la variante
# según el hardware detectado (RF-TRN-02, Capa 3).
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["ui", "desktop", "server/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PTH", "S", "N", "C4", "PL"]
ignore = [
  "PLR0913",  # muchos argumentos: habitual en factories/config
  "PLR2004",  # valores mágicos en comparaciones
  "PLC0415",  # imports diferidos: arranque rápido de la CLI
  "PLR0917",  # comandos Typer: cada opción es un parámetro
  "RUF001", "RUF002", "RUF003",  # caracteres ambiguos: textos en español
]

[tool.ruff.lint.per-file-ignores]
"engine/tests/**" = ["S101", "S105", "S106", "PLR2004", "PLC0415"]
"fixtures/**" = ["S311", "E501", "PLR0912", "PLR0914", "PLR0915"]

[tool.ruff.lint.isort]
known-first-party = ["perceptron", "perceptron_server"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
files = ["engine/perceptron"]

# mypy strict en core/domain/archspec/llm (SPEC §13.6)
[[tool.mypy.overrides]]
module = ["perceptron.core.*", "perceptron.domain.*", "perceptron.archspec.*", "perceptron.llm.*"]
strict = true

# Librerías de ML sin stubs completos
[[tool.mypy.overrides]]
module = ["sklearn.*", "timm.*", "mlflow.*", "torchvision.*", "fastexcel.*", "scipy.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["engine/tests"]
addopts = "-ra --strict-markers"
markers = [
  "slow: tests lentos (entrenamiento)",
  "gpu: requiere GPU (job nocturno)",
]

[tool.coverage.run]
source = ["perceptron"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ['if TYPE_CHECKING:', 'raise NotImplementedError', '^\s*\.\.\.$']
