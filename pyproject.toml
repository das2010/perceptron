[project]
name = "perceptron-workspace"
version = "0.1.0"
description = "Perceptron monorepo (workspace root, no se publica)"
requires-python = ">=3.12,<3.14"
dependencies = []

[dependency-groups]
dev = [
  "perceptron-engine[ml,llm,export,eval,sources]",
  "perceptron-server",
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6",
  "pytest-timeout>=2.3",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-pyyaml",
  "types-psutil",
  "xlsxwriter>=3.2",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["engine", "server"]

[tool.uv.sources]
perceptron-engine = { workspace = true }
perceptron-server = { workspace = true }
# Desarrollo y CI con wheels CPU de PyTorch (ADR-0014). La app instala la variante
# según el hardware detectado (RF-TRN-02, Capa 3).
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["ui", "desktop"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PTH", "S", "N", "C4", "PL"]
ignore = [
  "PLR0913",  # muchos argumentos: habitual en factories/config
  "PLR2004",  # valores mágicos en comparaciones
  "PLC0415",  # imports diferidos: arranque rápido de la CLI
  "PLR0917",  # comandos Typer: cada opción es un parámetro
  "PLR0911", "PLR0912", "PLR0915",  # funciones de despacho / tablas de decisión
  "SIM905",  # listas de palabras como "a b c".split() son más legibles
  "N812",  # convenciones `import lightning as L`, `functional as F`
  "RUF001", "RUF002", "RUF003",  # caracteres ambiguos: textos en español
]

[tool.ruff.lint.per-file-ignores]
"engine/tests/**" = ["S101", "S105", "S106", "PLR2004", "PLC0415"]
"server/tests/**" = ["S101", "S105", "S106", "PLR2004", "PLC0415"]
"server/deploy/**" = ["S101"]  # scripts de smoke: aserciones explícitas
"server/perceptron_server/migrations/**" = ["N999", "INP001"]
"fixtures/**" = ["S311", "E501", "PLR0914"]

[tool.ruff.lint.isort]
known-first-party = ["perceptron", "perceptron_server"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
files = ["engine/perceptron", "server/perceptron_server"]
exclude = ["server/perceptron_server/migrations/"]

# mypy strict en core/domain/archspec/llm (SPEC §13.6)
[[tool.mypy.overrides]]
module = ["perceptron.core.*", "perceptron.domain.*", "perceptron.archspec.*", "perceptron.llm.*", "perceptron.agent.*", "perceptron.api.access", "perceptron_server.*"]
strict = true

# Librerías de ML sin stubs completos
[[tool.mypy.overrides]]
module = ["sklearn.*", "timm.*", "mlflow.*", "torchvision.*", "fastexcel.*", "scipy.*", "cmaes.*", "soundfile.*", "pycocotools.*", "lightgbm.*", "presidio_analyzer.*", "presidio_anonymizer.*", "keyring.*", "onnxruntime.*", "onnxconverter_common.*", "captum.*", "reportlab.*", "celery.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["engine/tests", "server/tests"]
addopts = "-ra --strict-markers -m 'not e2e and not llm_live and not golden'"
# Un test colgado falla en vez de bloquear el CI (ej.: deadlock de DataLoader).
timeout = 600
markers = [
  "slow: tests lentos (entrenamiento)",
  "gpu: requiere GPU (job nocturno)",
  "e2e: aceptación de punta a punta (job e2e de CI)",
  "network: necesita internet (descarga modelos de prueba)",
  "llm_live: aceptación con proveedores LLM reales (workflow llm.yml, manual/nocturno)",
  "golden: golden tests de prompts contra proveedores reales (workflow llm.yml)",
]

[tool.coverage.run]
source = ["perceptron"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ['if TYPE_CHECKING:', 'raise NotImplementedError', '^\s*\.\.\.$']
