[project]
name = "perceptron-server"
version = "0.1.0"
description = "Perceptron Team Server: auth, RBAC, auditoría, UI web y (5b) cola de jobs"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary" }
dependencies = [
  "perceptron-engine[ml,llm,export,eval,sources]",
  "alembic>=1.13",        # MIT
  "argon2-cffi>=23.1",    # MIT
  "pyjwt>=2.9",           # MIT
  "authlib>=1.6",         # BSD-3 (SSO OIDC, Capa 5c)
  "joserfc>=1.1",         # BSD-3 (validación del ID token)
  "pg8000>=1.31",         # BSD-3 (driver PostgreSQL; psycopg es LGPL)
  "celery>=5.4",          # BSD-3 (cola de jobs, Capa 5b)
  "redis>=5.0",           # MIT (cliente de Valkey/Redis)
]

[project.scripts]
perceptron-server = "perceptron_server.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["perceptron_server"]
