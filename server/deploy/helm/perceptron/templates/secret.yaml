{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "perceptron.secretName" . }}
  labels: {{- include "perceptron.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ required "secrets.databaseUrl (o existingSecret)" .Values.secrets.databaseUrl | quote }}
  mlflow-database-url: {{ .Values.secrets.mlflowDatabaseUrl | quote }}
  secret-key: {{ required "secrets.secretKey (o existingSecret)" .Values.secrets.secretKey | quote }}
  master-key: {{ required "secrets.masterKey (o existingSecret)" .Values.secrets.masterKey | quote }}
  admin-email: {{ .Values.secrets.adminEmail | quote }}
  admin-password: {{ .Values.secrets.adminPassword | quote }}
{{- end }}
